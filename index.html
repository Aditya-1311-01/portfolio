<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aaditya Kumar Mishra | AI/ML &amp; GenAI Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4EF;--surface:#fff;--ink:#1A1B2E;--muted:#5E6075;--line:#DDD8CC;--acc:#E4572E;--blue:#2E5BE4;--e:#1F9D73;--m:#D99A12;--hd:#E4572E;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131C;--surface:#1C1E2B;--ink:#ECEAF4;--muted:#9A9CB3;--line:#34364A;--acc:#FF7A59;--blue:#7C9CFF;--e:#3DD6A0;--m:#F2BC3D;--hd:#FF7A59;--on:#12131C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12131C;--surface:#1C1E2B;--ink:#ECEAF4;--muted:#9A9CB3;--line:#34364A;--acc:#FF7A59;--blue:#7C9CFF;--e:#3DD6A0;--m:#F2BC3D;--hd:#FF7A59;--on:#12131C;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:4px;overflow-x:auto;height:52px;scrollbar-width:none}
nav button{flex:none;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;cursor:pointer}
nav button:hover{color:var(--ink)}nav .th{margin-left:auto;color:var(--ink)}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0}
h1{font-size:clamp(38px,9vw,68px);line-height:1.03;letter-spacing:-.02em}
h2{font-size:30px;margin-bottom:6px}
section{padding:54px 0 10px}
.eyebrow{color:var(--acc);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.sub{color:var(--muted);margin:0 0 20px}
.hero{padding:56px 0 20px}
.hero{display:grid;column-gap:32px;align-items:start}
.ph{position:relative;display:block;width:min(240px,64vw);aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:var(--line);border:5px solid var(--surface);box-shadow:0 0 0 3px var(--acc),0 14px 32px rgba(0,0,0,.2);margin:0 0 26px 0}
.ph img{position:absolute;inset:0;width:100%;height:100%}
.ph .bg{object-fit:cover;filter:blur(14px) saturate(1.1);transform:scale(1.25)}
.ph .fg{object-fit:contain}
@media(min-width:760px){.hero{grid-template-columns:1fr 280px}.hero>*{grid-column:1}.hero>.ph{grid-column:2;grid-row:1/span 5;width:280px;justify-self:center;margin:6px 0 0 0}.hero>.stats{grid-column:1/-1}}
.role{font-size:clamp(19px,4.4vw,26px);margin:14px 0;min-height:1.6em}
.role b{color:var(--acc);transition:opacity .3s}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;font-size:15px}
.btn.o{background:transparent;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{font-family:Fraunces,serif;font-size:30px;display:block;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--on)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.proj h3{margin:0 0 4px;font-size:18px}
.proj p{color:var(--muted);margin:4px 0 10px;font-size:15px}
.proj ul{padding-left:18px;margin:10px 0;font-size:14.5px}
.tag{font-size:12px;color:var(--blue);border:1px solid var(--blue);border-radius:999px;padding:1px 9px;margin-right:6px}
.link{color:var(--acc);font-weight:600;font-size:14px}
.lc{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.lc{grid-template-columns:260px 1fr}}
.ring{position:relative;width:200px;height:200px;margin:0 auto}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring .mid b{font-family:Fraunces,serif;font-size:40px;line-height:1}
.bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .5s}
.leg{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;font-size:15px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
input[type=number]{width:72px;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.tl{border-left:2px solid var(--line);padding-left:16px;margin-left:6px}
.tl div{margin-bottom:14px;position:relative}
.tl div:before{content:"";position:absolute;left:-23px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tl small{color:var(--muted)}
footer{padding:40px 0 60px;color:var(--muted);font-size:14px}
</style>
</head>
